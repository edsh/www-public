<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Anfahrt zum Flugplatz EDSH</title>
<desc id="desc">Reduzierte Orientierungskarte mit Heiningen, Schwenninger Straße, Oberndorfer Straße, Backnanger Straße, Stuttgarter Straße und der schmalen Zufahrt zum Flugplatz.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#edf3f6"/>
    <stop offset="1" stop-color="#dde7eb"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#00294b" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="1200" height="760" fill="url(#bg)"/>

<!-- Fields -->
<path d="M0 0H1200V205C1025 225 870 200 705 232C535 265 378 215 225 240C120 257 52 250 0 238Z" fill="#dfe9d7"/>
<path d="M0 520C180 490 335 535 510 505C690 475 855 520 1012 486C1092 468 1155 458 1200 450V760H0Z" fill="#d7e3d1"/>

<!-- Heiningen settlement hint -->
<g fill="#d2d8dc" opacity=".9">
  <rect x="110" y="318" width="46" height="30" rx="5"/>
  <rect x="170" y="332" width="42" height="28" rx="5"/>
  <rect x="226" y="310" width="50" height="31" rx="5"/>
  <rect x="135" y="372" width="48" height="30" rx="5"/>
  <rect x="196" y="388" width="44" height="28" rx="5"/>
  <rect x="258" y="365" width="50" height="31" rx="5"/>
  <rect x="168" y="430" width="48" height="29" rx="5"/>
  <rect x="230" y="446" width="45" height="28" rx="5"/>
  <rect x="290" y="420" width="52" height="30" rx="5"/>
  <rect x="340" y="470" width="48" height="29" rx="5"/>
</g>

<!-- Schwenninger Straße -->
<path d="M40 300C170 294 285 296 405 312C520 327 615 340 700 352"
      fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
<path d="M40 300C170 294 285 296 405 312C520 327 615 340 700 352"
      fill="none" stroke="#95a8b1" stroke-width="7" stroke-linecap="round"/>

<!-- Oberndorfer Straße -->
<path d="M480 0C472 104 470 190 476 270C480 306 488 332 505 348"
      fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
<path d="M480 0C472 104 470 190 476 270C480 306 488 332 505 348"
      fill="none" stroke="#8fa2ad" stroke-width="7" stroke-linecap="round"/>

<!-- First roundabout near Heiningen / Schwenninger Straße -->
<circle cx="520" cy="350" r="34" fill="#edf3f6" stroke="#fff" stroke-width="18"/>
<circle cx="520" cy="350" r="26" fill="none" stroke="#9dafb8" stroke-width="6"/>

<!-- Connection between the two roundabouts -->
<path d="M554 350C625 346 686 340 748 330"
      fill="none" stroke="#fff" stroke-width="31" stroke-linecap="round"/>
<path d="M554 350C625 346 686 340 748 330"
      fill="none" stroke="#a0b0b8" stroke-width="6" stroke-linecap="round"/>

<!-- Second roundabout -->
<circle cx="782" cy="326" r="35" fill="#edf3f6" stroke="#fff" stroke-width="18"/>
<circle cx="782" cy="326" r="26" fill="none" stroke="#9dafb8" stroke-width="6"/>

<!-- Stuttgarter Straße -->
<path d="M816 314C920 280 1025 248 1165 215"
      fill="none" stroke="#fff" stroke-width="35" stroke-linecap="round"/>
<path d="M816 314C920 280 1025 248 1165 215"
      fill="none" stroke="#879ba7" stroke-width="8" stroke-linecap="round"/>

<!-- Backnanger Straße -->
<path d="M796 355C845 402 889 454 925 515C950 556 974 607 1004 680"
      fill="none" stroke="#fff" stroke-width="35" stroke-linecap="round"/>
<path d="M796 355C845 402 889 454 925 515C950 556 974 607 1004 680"
      fill="none" stroke="#879ba7" stroke-width="8" stroke-linecap="round"/>

<!-- Narrow field road / cul-de-sac from Heiningen to the airfield -->
<path d="M320 520C470 515 620 510 760 505C850 502 920 498 985 492"
      fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
<path d="M320 520C470 515 620 510 760 505C850 502 920 498 985 492"
      fill="none" stroke="#b8c4ca" stroke-width="4" stroke-linecap="round"/>

<!-- Short spur from Backnanger Straße to the field road -->
<path d="M905 486C940 490 963 492 985 492"
      fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
<path d="M905 486C940 490 963 492 985 492"
      fill="none" stroke="#b8c4ca" stroke-width="4" stroke-linecap="round"/>

<!-- Small airfield / runway positioned south-east of the roundabouts -->
<path d="M970 458C1012 447 1058 450 1094 470L1102 542C1067 562 1024 566 982 550L958 528Z"
      fill="#d9e7d2" opacity=".96"/>

<g transform="translate(1035 505) rotate(87)">
  <rect x="-15" y="-73" width="30" height="146" rx="14" fill="#788e98"/>
  <rect x="-2.5" y="-58" width="5" height="116" rx="2.5" fill="#eef5f7"/>
</g>

<rect x="1062" y="530" width="40" height="17" rx="4" fill="#a8b7bd"/>

<!-- Labels -->
<g font-family="Arial, Helvetica, sans-serif" fill="#16394d">
  <text x="125" y="590" font-size="36" font-weight="800">Heiningen</text>
  <text x="110" y="278" font-size="21" font-weight="700">Schwenninger Straße</text>
  <text x="442" y="150" font-size="21" font-weight="700" transform="rotate(-88 442 150)">Oberndorfer Straße</text>
  <text x="875" y="278" font-size="21" font-weight="700" transform="rotate(-16 875 278)">Stuttgarter Straße</text>
  <text x="900" y="430" font-size="21" font-weight="700" transform="rotate(52 900 430)">Backnanger Straße</text>
</g>

<!-- Pin on the runway -->
<g transform="translate(1035 445)" filter="url(#shadow)">
  <path d="M0 -52C-25 -52 -46 -32 -46 -7C-46 23 0 68 0 68C0 68 46 23 46 -7C46 -32 25 -52 0 -52Z" fill="#e1272f"/>
  <circle cy="-7" r="18" fill="#fff"/>
  <path d="M-11 -7H11M0 -18V4" stroke="#0b4e7d" stroke-width="5" stroke-linecap="round"/>
</g>

<g transform="translate(945 387)" font-family="Arial, Helvetica, sans-serif">
  <rect width="180" height="46" rx="13" fill="#06365a" opacity=".96"/>
  <text x="90" y="30" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Flugplatz</text>
</g>

<!-- North -->
<g transform="translate(68 68)" font-family="Arial, Helvetica, sans-serif">
  <circle r="31" fill="#fff" opacity=".94"/>
  <path d="M0 -19L9 8L0 3L-9 8Z" fill="#0b4e7d"/>
  <text x="-6" y="24" fill="#0b4e7d" font-size="16" font-weight="700">N</text>
</g>
</svg>